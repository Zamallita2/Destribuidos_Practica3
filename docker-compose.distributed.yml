# Use scripts/start-distributed.ps1 with one role per physical PC.
# The regular docker-compose.yml remains the one-PC development mode.
services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - airres_network

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_PG1_DSN: "host=${PG_AM_HOST:?Use scripts/start-distributed.ps1} user=postgres password=${POSTGRES_PASSWORD:?} dbname=airres_am port=5432 sslmode=disable connect_timeout=3"
      DB_PG2_DSN: "host=${PG_EU_HOST:?Use scripts/start-distributed.ps1} user=postgres password=${POSTGRES_PASSWORD:?} dbname=airres_eu port=${PG_EU_PORT:?} sslmode=disable connect_timeout=3"
      DB_MONGO_URI: "mongodb://root:${MONGO_PASSWORD:?}@${MONGO_HOST:?Use scripts/start-distributed.ps1}:27017/?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000"
      DB_MONGO_NAME: airres_sync
      NODE_ID: "${NODE_ID:?Use scripts/start-distributed.ps1}"
      CLUSTER_BOOTSTRAP: "${CLUSTER_BOOTSTRAP:-false}"
      BOARDING_PASS_SECRET: "${BOARDING_PASS_SECRET:?}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?Use scripts/start-distributed.ps1}"
      QR_LAN_URL_FILE: /app/data/qr-lan-url.txt
      PERCENTAGE_SOLD: "73"
      REFUND_DELAY_MINUTES: "15"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./dataset:/app/dataset
      - ./reports:/app/reports
      - ./wallet-secrets:/run/wallet-secrets:ro
    networks:
      - airres_network

  postgres_am:
    profiles: [america]
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: airres_am
    ports:
      - "5432:5432"
    volumes:
      - pgdata_am:/var/lib/postgresql/data
      - ./init-scripts/init-pg-am.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - airres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airres_am"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres_eu:
    profiles: [europa]
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: airres_eu
    ports:
      - "5435:5432"
    volumes:
      - pgdata_eu:/var/lib/postgresql/data
      - ./init-scripts/init-pg-eu.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - airres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airres_eu"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    profiles: [mongo]
    restart: unless-stopped
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?}"
      MONGO_INITDB_DATABASE: airres_sync
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./init-scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - airres_network

volumes:
  pgdata_am:
  pgdata_eu:
  mongodata:

networks:
  airres_network:
    driver: bridge
