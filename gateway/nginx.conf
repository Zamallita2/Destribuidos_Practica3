# API gateway for the three regional API servers.
# Requests go to the server of the buyer's region (X-Region header). If that
# server does not answer, nginx tries the next one, so the system keeps
# working with a server down. POST requests are only retried when the failed
# server never received them (connection refused), so a purchase is never
# sent twice.
events {}

http {
  upstream node_america {
    server backend_am:8080 max_fails=1 fail_timeout=10s;
    server backend_eu:8080 backup;
    server backend_as:8080 backup;
  }
  upstream node_europa {
    server backend_eu:8080 max_fails=1 fail_timeout=10s;
    server backend_as:8080 backup;
    server backend_am:8080 backup;
  }
  upstream node_asia {
    server backend_as:8080 max_fails=1 fail_timeout=10s;
    server backend_eu:8080 backup;
    server backend_am:8080 backup;
  }

  map $http_x_region $region_node {
    default  node_america;
    America  node_america;
    Europa   node_europa;
    Asia     node_asia;
  }

  server {
    listen 8080;
    client_max_body_size 200m;

    proxy_connect_timeout 2s;
    proxy_read_timeout 600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The CSV/matrix import runs on the primary server only.
    location /api/entradas {
      proxy_pass http://node_america;
    }

    location / {
      proxy_pass http://$region_node;
    }
  }
}
