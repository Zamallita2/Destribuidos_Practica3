# PC 2 · Base de datos PostgreSQL Europa/Asia.
# Uso, desde la carpeta distribuido/:
#   docker compose -f docker-compose.pc2-europa.yml up -d
name: airres-pc2

services:
  postgres_eu:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airres_eu
    ports:
      - "5435:5432"
    volumes:
      - pgdata_eu:/var/lib/postgresql/data
      - ../init-scripts/init-pg-eu.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_eu:
